name: CD

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build JAR
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/team4-backend-api:$IMAGE_TAG -t $ECR_REGISTRY/team4-backend-api:latest .
          docker push $ECR_REGISTRY/team4-backend-api:$IMAGE_TAG
          docker push $ECR_REGISTRY/team4-backend-api:latest

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag in config repo
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone https://x-access-token:$GH_PAT@github.com/CLD-05/team4_config.git
          cd team4_config
          git checkout main
          cd apps/diary-app/overlays/prod
          kustomize edit set image \
            194722398200.dkr.ecr.ap-northeast-2.amazonaws.com/team4-backend-api=$ECR_REGISTRY/team4-backend-api:$IMAGE_TAG
          git config user.email "ci@github.com"
          git config user.name "GitHub Actions"
          git commit -am "ci: update image tag to $IMAGE_TAG"
          git push
