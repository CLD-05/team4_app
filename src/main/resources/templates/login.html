<!DOCTYPE html>

<html lang="ko"><head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Dear Diary - 로그인</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-surface": "#34302b",
                        "outline-variant": "#c9c6bd",
                        "error-container": "#ffdad6",
                        "on-surface-variant": "#484740",
                        "secondary": "#446278",
                        "secondary-container": "#c5e3fe",
                        "secondary-fixed-dim": "#accae4",
                        "surface-container": "#f6ece5",
                        "on-primary-container": "#706f6b",
                        "surface-container-lowest": "#ffffff",
                        "tertiary": "#605e5f",
                        "on-secondary-container": "#48667c",
                        "on-tertiary-fixed-variant": "#484648",
                        "on-background": "#1f1b17",
                        "secondary-fixed": "#c9e6ff",
                        "tertiary-fixed": "#e6e1e3",
                        "inverse-on-surface": "#f9efe8",
                        "surface": "#fff8f4",
                        "error": "#ba1a1a",
                        "surface-container-low": "#fcf2eb",
                        "surface-tint": "#605e5a",
                        "background": "#fff8f4",
                        "on-primary-fixed-variant": "#484743",
                        "primary-container": "#f7f3ee",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#1c1c19",
                        "on-secondary-fixed-variant": "#2c4a5f",
                        "primary": "#605e5a",
                        "on-secondary": "#ffffff",
                        "surface-dim": "#e2d8d2",
                        "tertiary-container": "#f7f2f4",
                        "on-surface": "#1f1b17",
                        "tertiary-fixed-dim": "#cac5c7",
                        "surface-variant": "#eae1da",
                        "surface-container-high": "#f0e6e0",
                        "primary-fixed-dim": "#c9c6c1",
                        "on-primary": "#ffffff",
                        "inverse-primary": "#c9c6c1",
                        "on-tertiary": "#ffffff",
                        "surface-bright": "#fff8f4",
                        "primary-fixed": "#e6e2dd",
                        "on-tertiary-fixed": "#1c1b1d",
                        "outline": "#79776f",
                        "on-error": "#ffffff",
                        "on-secondary-fixed": "#001e2f",
                        "surface-container-highest": "#eae1da",
                        "on-tertiary-container": "#716e70"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "container-padding-desktop": "40px",
                        "section-gap": "48px",
                        "container-padding-mobile": "20px",
                        "gutter": "16px",
                        "base": "8px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Literata"],
                        "display-lg": ["Literata"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Literata"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "display-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["13px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
    <style>
        .noise-bg {
            position: relative;
        }
        .noise-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        .content-layer {
            position: relative;
            z-index: 1;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 30px rgba(92, 86, 81, 0.05);
        }
    </style>
    <script src="/js/api.js"></script>
</head>
<body class="bg-background noise-bg min-h-screen flex items-center justify-center p-4 antialiased text-on-surface">
<main class="content-layer w-full max-w-md">
    <!-- Logo & Header -->
    <div class="text-center mb-section-gap">
        <h1 class="font-display-lg-mobile md:font-display-lg text-display-lg-mobile md:text-display-lg text-primary mb-2">
            Dear Diary
        </h1>
        <p class="font-body-md text-body-md text-on-surface-variant">
            당신만의 소중한 공간에 다시 오신 것을 환영합니다.
        </p>
    </div>
    <!-- Login Card -->
    <div class="glass-card rounded-xl p-8 sm:p-10">
        <form class="space-y-6" id="loginForm">
            <!-- Id Input -->
            <div>
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="Id">
                    아이디
                </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none" data-icon="mail">mail</span>
                    <input class="block w-full pl-10 pr-3 py-3 border-0 border-b-2 border-surface-variant bg-transparent text-on-surface focus:ring-0 focus:border-secondary transition-colors font-headline-md text-body-md placeholder:text-outline-variant placeholder:font-body-md outline-none" id="loginId" name="loginId" placeholder="아이디" required="" type="text"/>
                </div>
            </div>
            <!-- Password Input -->
            <div>
                <label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">
                    비밀번호
                </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute inset-y-0 left-0 pl-3 flex items-center text-outline pointer-events-none" data-icon="lock">lock</span>
                    <input class="block w-full pl-10 pr-3 py-3 border-0 border-b-2 border-surface-variant bg-transparent text-on-surface focus:ring-0 focus:border-secondary transition-colors font-headline-md text-body-md placeholder:text-outline-variant placeholder:font-body-md" id="password" name="password" placeholder="••••••••" required="" type="password"/>
                </div>
            </div>
            <div class="flex items-center justify-end mt-4">
                <div class="text-sm space-y-2 text-right">
                    <a class="block font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="/id-return">
                        아이디를 잊으셨나요?
                    </a>
                    <a class="block font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors" href="/pw-reset">
                        비밀번호를 잊으셨나요?
                    </a>
                </div>
            </div>
            <!-- Actions -->
            <div class="pt-4">
                <button class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm font-label-sm text-label-sm text-on-secondary bg-secondary hover:bg-on-secondary-container focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary transition-all active:scale-95" type="submit">
                    로그인
                </button>
            </div>
        </form>
        <div class="mt-8 text-center">
            <p class="font-body-md text-sm text-on-surface-variant">
                계정이 없으신가요?
                <a class="font-label-sm text-label-sm text-secondary hover:text-on-secondary-container transition-colors ml-1" href="/sign-up">
                    회원가입
                </a>
            </p>
        </div>
    </div>
    <!-- Decorative Elements (Optional for warm vibe) -->
    <div class="absolute -z-10 top-10 -left-10 w-32 h-32 bg-secondary-container/20 rounded-full blur-3xl"></div>
    <div class="absolute -z-10 bottom-10 -right-10 w-40 h-40 bg-surface-dim/40 rounded-full blur-3xl"></div>
</main>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loginId = document.getElementById('loginId').value;
        const password = document.getElementById('password').value;
        try {
            await auth.login(loginId, password);
            window.location.href = '/main';
        } catch (err) {
            alert('로그인 실패: ' + err.message);
        }
    });
</script>
</body></html>
