<!DOCTYPE html><html lang="ko"><head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>비밀번호 찾기 - 디어 다이어리</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&amp;family=Plus+Jakarta+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
    <style>
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0px 1000px transparent inset;
            transition: background-color 5000s ease-in-out 0s;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }

        /* Subtle noise texture for analog feel */
        .bg-noise {
            position: relative;
        }
        .bg-noise::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0.03;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            z-index: 0;
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#605e5f",
                        "surface-container-low": "#fcf2eb",
                        "on-surface-variant": "#484740",
                        "error": "#ba1a1a",
                        "surface": "#fff8f4",
                        "secondary-container": "#c5e3fe",
                        "on-secondary-container": "#48667c",
                        "surface-tint": "#605e5a",
                        "on-secondary-fixed": "#001e2f",
                        "inverse-primary": "#c9c6c1",
                        "on-primary": "#ffffff",
                        "surface-bright": "#fff8f4",
                        "surface-container-high": "#f0e6e0",
                        "on-tertiary": "#ffffff",
                        "inverse-surface": "#34302b",
                        "error-container": "#ffdad6",
                        "outline-variant": "#c9c6bd",
                        "on-surface": "#1f1b17",
                        "outline": "#79776f",
                        "on-error": "#ffffff",
                        "inverse-on-surface": "#f9efe8",
                        "secondary": "#446278",
                        "background": "#fff8f4",
                        "primary-container": "#f7f3ee",
                        "secondary-fixed": "#c9e6ff",
                        "on-tertiary-fixed-variant": "#484648",
                        "tertiary-fixed-dim": "#cac5c7",
                        "primary": "#605e5a",
                        "on-tertiary-container": "#716e70",
                        "on-secondary": "#ffffff",
                        "on-background": "#1f1b17",
                        "tertiary-fixed": "#e6e1e3",
                        "tertiary-container": "#f7f2f4",
                        "surface-container-lowest": "#ffffff",
                        "on-tertiary-fixed": "#1c1b1d",
                        "surface-container-highest": "#eae1da",
                        "surface-container": "#f6ece5",
                        "on-error-container": "#93000a",
                        "surface-dim": "#e2d8d2",
                        "on-primary-fixed-variant": "#484743",
                        "primary-fixed-dim": "#c9c6c1",
                        "surface-variant": "#eae1da",
                        "on-secondary-fixed-variant": "#2c4a5f",
                        "on-primary-container": "#706f6b",
                        "primary-fixed": "#e6e2dd",
                        "on-primary-fixed": "#1c1c19",
                        "secondary-fixed-dim": "#accae4"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "section-gap": "48px",
                        "gutter": "16px",
                        "container-padding-desktop": "40px",
                        "base": "8px",
                        "container-padding-mobile": "20px"
                    },
                    "fontFamily": {
                        "display-lg-mobile": ["Literata"],
                        "headline-md": ["Literata"],
                        "display-lg": ["Literata"],
                        "body-md": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "display-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "1.4", "fontWeight": "600" }],
                        "display-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "label-sm": ["13px", { "lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md text-body-md antialiased bg-noise min-h-screen flex flex-col justify-center items-center p-gutter">
<header class="absolute top-0 left-0 w-full px-6 py-6 md:px-10 z-10">
    <a href="/main" class="font-serif text-2xl md:text-3xl text-primary italic font-bold hover:opacity-80 transition-opacity">Dear Diary</a>
</header>
<!-- Transactional Focus: Navigation Shells Suppressed -->
<main class="w-full max-w-md relative z-10">
    <!-- Brand Anchor 제거, 헤더로 이동 -->
    <!-- Level 1 Card: Soft, diffused shadow on paper-like surface -->
    <div class="bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_0_rgba(92,86,81,0.05)] border border-outline-variant/20 p-8 md:p-10">
        <!-- Header section with reassuring tone -->
        <div class="text-center mb-8">
            <span class="material-symbols-outlined text-secondary text-4xl mb-4" style="font-variation-settings: 'wght' 200;">vpn_key</span>
            <h2 class="font-headline-md text-headline-md text-on-surface mb-3">비밀번호 재설정</h2>
            <p class="font-body-md text-body-md text-on-surface-variant">
                가입하신 아이디와 이메일을 입력하시면 비밀번호를 재설정할 수 있습니다.
            </p>
        </div>
        <!-- Form -->
        <form action="#" class="space-y-6" method="POST">
            <!-- User ID Input -->
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant" for="userId">아이디</label>
                <input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-headline-md text-headline-md text-on-surface placeholder:text-outline/50 focus:ring-0 focus:border-secondary transition-colors outline-none" id="userId" name="userId" placeholder="아이디를 입력하세요" required="" type="text">
            </div>
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant" for="email">등록된 이메일</label>
                <input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-headline-md text-headline-md text-on-surface placeholder:text-outline/50 focus:ring-0 focus:border-secondary transition-colors outline-none" id="email" name="email" placeholder="이메일을 입력하세요" required="" type="email">
            </div>
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant" for="newPassword">새 비밀번호</label>
                <input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-headline-md text-headline-md text-on-surface placeholder:text-outline/50 focus:ring-0 focus:border-secondary transition-colors outline-none" id="newPassword" name="newPassword" placeholder="새 비밀번호 (8자 이상)" required="" type="password">
            </div>
            <div class="flex flex-col gap-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant" for="confirmPassword">새 비밀번호 확인</label>
                <input class="w-full bg-transparent border-0 border-b border-outline-variant px-0 py-2 font-headline-md text-headline-md text-on-surface placeholder:text-outline/50 focus:ring-0 focus:border-secondary transition-colors outline-none" id="confirmPassword" name="confirmPassword" placeholder="비밀번호 재입력" required="" type="password">
            </div>
            <!-- Primary Action Button -->
            <div class="pt-4">
                <button class="w-full bg-secondary text-on-secondary font-label-sm text-label-sm py-4 px-6 rounded-full hover:bg-on-secondary-container transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-secondary/50 focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                    재설정 하기
                </button>
            </div>
        </form>
        <!-- Secondary Navigation -->
        <div class="mt-8 text-center">
            <a class="inline-flex items-center gap-2 font-label-sm text-label-sm text-on-surface-variant hover:text-secondary transition-colors" href="/login">
                <span class="material-symbols-outlined" style="font-size: 16px;">arrow_back</span>
                로그인 페이지로 돌아가기
            </a>
        </div>
    </div>
</main>
<script src="/js/api.js"></script>
<script>
    document.querySelector('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const loginId = document.getElementById('userId').value.trim();
        const email = document.getElementById('email').value.trim();
        const newPassword = document.getElementById('newPassword').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        if (newPassword.length < 8) return alert('비밀번호는 8자 이상이어야 합니다.');
        if (newPassword !== confirmPassword) return alert('비밀번호가 일치하지 않습니다.');
        try {
            await api.post('/users/reset-password', { loginId, email, newPassword });
            alert('비밀번호가 재설정되었습니다. 로그인 페이지로 이동합니다.');
            window.location.href = '/login';
        } catch (err) {
            alert(err.message || '아이디 또는 이메일이 올바르지 않습니다.');
        }
    });
</script>
</body></html>
