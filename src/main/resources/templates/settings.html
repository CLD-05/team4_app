<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md ...">
<!-- TopAppBar -->
<!-- The settings screen is a destination but often implies a slight departure from the main flow.
         However, "Settings" is in the JSON trailing actions, and the user requested a TopAppBar.
         We will use the TopAppBar as defined in the JSON. -->
<header class="bg-surface dark:bg-inverse-surface docked full-width top-0 bg-surface dark:bg-inverse-surface flex justify-between items-center w-full px-container-padding-mobile md:px-container-padding-desktop py-4 sticky z-40 transition-all duration-300">
    <div class="flex items-center">
        <a href="/main" class="font-serif text-3xl md:text-4xl text-primary italic font-bold hover:opacity-80 transition-opacity">
            Dear Diary
        </a>
    </div>

</header>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center px-container-padding-mobile md:px-container-padding-desktop py-section-gap">
    <!-- Focused Canvas Container (Max width for book-like feel on desktop) -->
    <div class="w-full max-w-[600px] flex flex-col gap-8">
        <!-- Page Title -->
        <h2 class="font-headline-md text-headline-md text-on-background">설정</h2>
        <!-- User Profile Section (Bento style card) -->
        <section class="bg-surface-container-lowest rounded-xl p-6 md:p-8 card-shadow border border-outline-variant/30 flex flex-col md:flex-row items-center md:items-start gap-6">
            <!-- Avatar -->
            <div class="w-24 h-24 rounded-full overflow-hidden shrink-0 border-2 border-surface-container-high bg-surface-container-low flex items-center justify-center">
                <img id="user-profile-img" alt="User Avatar" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL-kC0KuzqQYam8yrvJPzenw4gRau-kRc9dYOOAKoUmWWh61dqr7qGrZwPrfA5mes3IaoqDnXs9LqOVtjtt3U0TohctHyiAatGKZAlPlf_T0aYTNfpHbpSn5eXvR6ja2TRvYuI8r4usylxel_mpUqnuQfpEBEueZYM0hzllsJ7n-SZ6OLqZRoxz0LudKlM4Ton8_CNmHbsfrh7mRGUqMq3afZkmrdYEJW-kwi0yRPOl3_2HAyZINFE3uJYCIa1Uey6Hui-k62Yn-J3"/>
            </div>

                <!-- 수정 -->
                <p class="font-label-sm text-label-sm text-on-surface-variant flex items-center gap-1">
                    <span class="material-symbols-outlined text-[16px]">calendar_today</span>
                    가입 날짜: <span id="user-created-at"></span>

                <p class="font-body-md text-body-md text-on-surface-variant mt-2 max-w-sm">
                    오늘의 소중한 순간들을 기록합니다.
                </p>
            </div>
        </section>
        <!-- Menu List (Glassmorphism inspired soft cells) -->
        <section class="flex flex-col gap-4">
            <!-- Edit Profile -->
            <button onclick="openProfileModal()" class="w-full bg-surface-container-lowest hover:bg-surface-container-low transition-colors rounded-lg p-4 card-shadow border border-outline-variant/20 flex items-center justify-between group active:scale-[0.98] duration-200">

</main>
<!-- BottomNavBar (Settings is usually a sub-page or focused journey, but if we treat this as a main tab context, we shouldn't render it here as Settings isn't in the tab_labels.
         However, the user asked for a standard My Page. We will suppress the BottomNavBar as it's a settings/profile specific page, prioritizing the canvas.) -->
<script>
    // Subtle scroll effect for header
    const header = document.querySelector('header');
    window.addEventListener('scroll', () => {
        if (window.scrollY > 20) {
            header.classList.add('shadow-sm');
            header.classList.replace('py-4', 'py-2');
        } else {
            header.classList.remove('shadow-sm');
            header.classList.replace('py-2', 'py-4');
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        if (!auth.isLoggedIn()) {
            window.location.href = '/login';
            return;
        }

        try {
            const user = await api.get('/users/me');
            document.getElementById('user-nickname').textContent = user.nickname;

            const joinDate = new Date(user.createdAt);
            const formatted = `${joinDate.getFullYear()}.${String(joinDate.getMonth()+1).padStart(2,'0')}.${String(joinDate.getDate()).padStart(2,'0')}`;
            document.getElementById('user-created-at').textContent = formatted;

            if (user.profileImg) {
                document.getElementById('user-profile-img').src = user.profileImg;
            }
        } catch (err) {
            console.error('Failed to load user profile:', err);
        }
    });

    function handleLogout() {
        auth.logout();
    }
</script>
<!-- ===== 프로필 수정 모달 ===== -->

                        <label class="font-label-sm text-label-sm text-on-surface-variant">새 비밀번호</label>

                    </div>

<!-- ===== 회원탈퇴 확인 모달 ===== -->
<div id="delete-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4">
    <div onclick="closeDeleteModal()" class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative w-full max-w-[360px] bg-surface-container-lowest rounded-2xl card-shadow border border-outline-variant/30 overflow-hidden">
        <div class="p-6 flex flex-col items-center gap-4 text-center">
            <div class="w-12 h-12 rounded-full bg-error-container flex items-center justify-center">
                <span class="material-symbols-outlined text-error" style="font-size:24px;">person_remove</span>
            </div>
            <div>

<script>
    /* ── 모달 열기/닫기 ── */
    function openProfileModal() {
        document.getElementById('profile-modal').classList.remove('hidden');
        switchTab('pw');
        clearProfileForm();
    }
    function closeProfileModal() {
        document.getElementById('profile-modal').classList.add('hidden');
    }
    function openDeleteModal() {
        document.getElementById('delete-modal').classList.remove('hidden');
        document.getElementById('delete-error').classList.add('hidden');
    }
    function closeDeleteModal() {
        document.getElementById('delete-modal').classList.add('hidden');
    }

    /* ── 탭 전환 ── */
    function switchTab(tab) {
        const isPw = tab === 'pw';
        document.getElementById('panel-pw').classList.toggle('hidden', !isPw);
        document.getElementById('panel-img').classList.toggle('hidden', isPw);
        document.getElementById('tab-pw').className = `flex-1 py-3 text-body-md font-semibold transition-colors ${isPw ? 'text-primary border-b-2 border-primary' : 'text-on-surface-variant border-b-2 border-transparent'}`;
        document.getElementById('tab-img').className = `flex-1 py-3 text-body-md font-semibold transition-colors ${!isPw ? 'text-primary border-b-2 border-primary' : 'text-on-surface-variant border-b-2 border-transparent'}`;
    }

    /* ── 폼 초기화 ── */
    let selectedImageBase64 = null;

    function clearProfileForm() {
        ['current-pw', 'new-pw', 'confirm-pw'].forEach(id => document.getElementById(id).value = '');
        document.getElementById('pw-error').classList.add('hidden');
        selectedImageBase64 = null;
        document.getElementById('profile-img-file').value = '';
        document.getElementById('img-error').classList.add('hidden');
        const currentSrc = document.getElementById('user-profile-img').src;
        document.getElementById('preview-img').src = currentSrc;
    }

    /* ── 이미지 파일 미리보기 ── */
    function previewImageFile(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
            selectedImageBase64 = e.target.result;
            document.getElementById('preview-img').src = selectedImageBase64;
        };
        reader.readAsDataURL(file);
    }

    /* ── 비밀번호 변경 제출 ── */
    async function submitPasswordChange() {
        const currentPw = document.getElementById('current-pw').value.trim();
        const newPw     = document.getElementById('new-pw').value.trim();
        const confirmPw = document.getElementById('confirm-pw').value.trim();
        const errEl     = document.getElementById('pw-error');

        errEl.classList.add('hidden');

        if (!currentPw || !newPw || !confirmPw) {
            errEl.textContent = '모든 항목을 입력해주세요.'; errEl.classList.remove('hidden'); return;
        }
        if (newPw.length < 8) {
            errEl.textContent = '새 비밀번호는 8자 이상이어야 합니다.'; errEl.classList.remove('hidden'); return;
        }
        if (newPw !== confirmPw) {
            errEl.textContent = '새 비밀번호가 일치하지 않습니다.'; errEl.classList.remove('hidden'); return;
        }

        try {
            await api.patch('/users/password', { currentPassword: currentPw, newPassword: newPw });
            closeProfileModal();
            showToast('비밀번호가 변경되었습니다.');
        } catch (e) {
            errEl.textContent = e.message || '비밀번호 변경에 실패했습니다.';
            errEl.classList.remove('hidden');
        }
    }

    /* ── 프로필 이미지 변경 제출 ── */
    async function submitProfileImg() {
        const errEl = document.getElementById('img-error');
        errEl.classList.add('hidden');
        const fileInput = document.getElementById('profile-img-file');
        if (!fileInput.files[0]) {
            errEl.textContent = '사진을 선택해주세요.'; errEl.classList.remove('hidden'); return;
        }
        const formData = new FormData();
        formData.append('file', fileInput.files[0]);
        try {
            const token = localStorage.getItem('accessToken');
            const res = await fetch('/api/users/profile-img/upload', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` },
                body: formData
            });
            if (!res.ok) throw new Error(await res.text());
            const url = await res.text();
            document.getElementById('user-profile-img').src = url;
            closeProfileModal();
            showToast('프로필 사진이 변경되었습니다.');
        } catch (e) {
            errEl.textContent = e.message || '사진 변경에 실패했습니다.';
            errEl.classList.remove('hidden');
        }
    }

    /* ── 회원탈퇴 제출 ── */
    async function submitDeleteAccount() {
        const errEl = document.getElementById('delete-error');
        errEl.classList.add('hidden');
        try {
            await api.delete('/users/me');
            auth.logout();          // 로컬 토큰 제거 후 로그인 페이지로
        } catch (e) {
            errEl.textContent = e.message || '탈퇴 처리 중 오류가 발생했습니다.';
            errEl.classList.remove('hidden');
        }
    }

    /* ── 토스트 메시지 ── */
    function showToast(msg) {
        const toast = document.createElement('div');
        toast.textContent = msg;
        toast.className = 'fixed bottom-6 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-5 py-3 rounded-full text-body-md shadow-lg z-[100] transition-opacity duration-300';
        document.body.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2500);
    }
</script>
</body></html>
