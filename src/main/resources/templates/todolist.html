<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>하루결 - 오늘의 할 일</title>
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=Noto+Sans+KR:wght@300..900&family=Plus+Jakarta+Sans:wght@200..800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        serif: ['Literata', 'serif'],
                        sans: ['Noto Sans KR', 'sans-serif'],
                        body: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        primary: "#605e5a",
                        secondary: "#446278",
                        "secondary-container": "#c5e3fe",
                        "on-secondary-container": "#48667c",
                        background: "#fff8f4",
                        "on-background": "#1f1b17",
                        "surface-container-low": "#fcf2eb",
                        "surface-container-lowest": "#ffffff",
                        "on-surface-variant": "#484740",
                        "outline": "#79776f",
                        "outline-variant": "#c9c6bd",
                        error: "#ba1a1a",
                    }
                }
            }
        }
    </script>

    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-background text-on-background min-h-screen flex flex-col font-sans antialiased">

<header class="w-full top-0 sticky z-40 bg-background/80 backdrop-blur-md">
    <div class="flex justify-between items-center px-6 md:px-10 py-2 max-w-7xl mx-auto">
        <div class="font-serif text-3xl md:text-4xl text-primary italic font-bold">
            Dear Diary
        </div>
        <div class="flex items-center gap-4">
            <button class="text-on-surface-variant hover:text-secondary transition-colors">
                <span class="material-symbols-outlined">search</span>
            </button>
            <button class="text-on-surface-variant hover:text-secondary transition-colors">
                <span class="material-symbols-outlined">account_circle</span>
            </button>
        </div>
    </div>
</header>

<div class="flex flex-1 max-w-7xl mx-auto w-full relative">
    <nav class="hidden md:flex flex-col w-64 fixed h-full pl-10 pt-4 gap-2 top-16">
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/main">
            <span class="material-symbols-outlined">home</span> 홈
        </a>
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/diary">
            <span class="material-symbols-outlined">auto_stories</span> 일기
        </a>
        <a class="flex items-center gap-4 bg-secondary-container text-on-secondary-container px-5 py-3 rounded-full font-bold shadow-sm" href="/todolist">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span> 오늘의 할 일
        </a>
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/report">
            <span class="material-symbols-outlined">equalizer</span> 통계
        </a>
    </nav>

    <main class="flex-1 w-full md:ml-64 px-6 md:px-10 pb-32 pt-8">
        <div class="max-w-3xl mx-auto flex flex-col gap-10">

            <section class="flex flex-col gap-4">
                <h1 class="text-2xl font-bold text-on-background">오늘의 할 일</h1>
                <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide snap-x">
                    <button class="snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant shadow-sm hover:bg-white transition-all">
                        <span class="text-xs uppercase opacity-60 font-body">Mon</span>
                        <span class="text-xl font-bold mt-1">12</span>
                    </button>
                    <button class="snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant shadow-sm hover:bg-white transition-all">
                        <span class="text-xs uppercase opacity-60 font-body">Tue</span>
                        <span class="text-xl font-bold mt-1">13</span>
                    </button>
                    <button class="snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl bg-secondary-container text-on-secondary-container shadow-md ring-1 ring-secondary/20 transition-all font-bold">
                        <span class="text-xs uppercase opacity-90 font-body">Wed</span>
                        <span class="text-xl mt-1">14</span>
                    </button>
                    <button class="snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant shadow-sm hover:bg-white transition-all">
                        <span class="text-xs uppercase opacity-60 font-body">Thu</span>
                        <span class="text-xl font-bold mt-1">15</span>
                    </button>
                    <button class="snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl bg-surface-container-lowest text-on-surface-variant shadow-sm hover:bg-white transition-all">
                        <span class="text-xs uppercase opacity-60 font-body">Fri</span>
                        <span class="text-xl font-bold mt-1">16</span>
                    </button>
                </div>
            </section>

            <section class="bg-surface-container-low rounded-2xl p-6 relative overflow-hidden flex flex-col gap-2">
                <div class="absolute -right-4 -top-4 opacity-5 pointer-events-none">
                    <span class="material-symbols-outlined text-[120px]">psychiatry</span>
                </div>
                <span class="text-xs text-secondary font-bold uppercase tracking-widest">Gentle Reminder</span>
                <p class="text-xl text-on-surface-variant italic relative z-10 leading-relaxed font-serif">
                    "작은 발걸음도 충분한 진전입니다. 오늘 당신의 할 일들을 하나씩 차분히 이뤄가 보세요."
                </p>
            </section>

            <section class="flex flex-col gap-4">
                <div class="flex items-center gap-4 bg-white rounded-xl p-2 pl-6 shadow-sm focus-within:ring-2 focus-within:ring-secondary/20 transition-all border border-surface-variant/50">
                    <span class="material-symbols-outlined text-outline">add_circle</span>
                    <input class="flex-1 bg-transparent border-none focus:ring-0 text-lg text-on-background placeholder:text-outline-variant py-4"
                           placeholder="오늘의 할 일을 추가해보세요..."
                           type="text">
                    <button class="bg-secondary text-on-secondary px-6 py-3 rounded-lg font-bold hover:bg-secondary/90 transition-colors">
                        추가
                    </button>
                </div>
            </section>

            <section class="flex flex-col gap-4" id="todo-list">
                <div class="todo-item group flex items-center justify-between p-5 bg-surface-container-lowest rounded-xl shadow-sm transition-all hover:shadow-md border border-surface-variant/50">
                    <div class="flex items-center gap-4 flex-1">
                        <label class="relative flex items-center justify-center cursor-pointer">
                            <input class="peer sr-only todo-checkbox" type="checkbox">
                            <div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:bg-secondary peer-checked:border-secondary transition-all flex items-center justify-center">
                                <span class="material-symbols-outlined text-on-secondary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
                            </div>
                        </label>
                        <span class="todo-text text-lg text-on-background transition-all">아침 명상하기</span>
                    </div>
                    <button class="text-outline-variant hover:text-error transition-colors opacity-0 group-hover:opacity-100 p-2">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>

                <div class="todo-item group flex items-center justify-between p-5 bg-surface-container-lowest rounded-xl shadow-sm transition-all hover:shadow-md border border-surface-variant/50">
                    <div class="flex items-center gap-4 flex-1">
                        <label class="relative flex items-center justify-center cursor-pointer">
                            <input class="peer sr-only todo-checkbox" type="checkbox">
                            <div class="w-6 h-6 rounded-full border-2 border-outline-variant peer-checked:bg-secondary peer-checked:border-secondary transition-all flex items-center justify-center">
                                <span class="material-symbols-outlined text-on-secondary text-[16px] opacity-0 peer-checked:opacity-100 transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
                            </div>
                        </label>
                        <span class="todo-text text-lg text-on-background transition-all">물 2L 마시기</span>
                    </div>
                    <button class="text-outline-variant hover:text-error transition-colors opacity-0 group-hover:opacity-100 p-2">
                        <span class="material-symbols-outlined">delete</span>
                    </button>
                </div>
            </section>
        </div>
    </main>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-container-low/95 backdrop-blur-lg rounded-t-2xl shadow-lg border-t border-outline-variant/20">
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/main">
        <span class="material-symbols-outlined">home</span>
        <span class="text-[10px] mt-1 font-bold">홈</span>
    </a>
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/diary">
        <span class="material-symbols-outlined">auto_stories</span>
        <span class="text-[10px] mt-1 font-bold">일기</span>
    </a>
    <a class="flex flex-col items-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-2 shadow-sm" href="/todolist">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span>
        <span class="text-[10px] font-bold mt-1">할 일</span>
    </a>
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/report">
        <span class="material-symbols-outlined">equalizer</span>
        <span class="text-[10px] mt-1 font-bold">통계</span>
    </a>
</nav>

<script>
    document.querySelectorAll('.todo-checkbox').forEach(checkbox => {
        checkbox.addEventListener('change', (e) => {
            const item = e.target.closest('.todo-item');
            const text = item.querySelector('.todo-text');
            if(e.target.checked) {
                item.classList.add('opacity-60', 'bg-surface-container-low');
                item.classList.remove('bg-surface-container-lowest');
                text.classList.add('line-through');
            } else {
                item.classList.remove('opacity-60', 'bg-surface-container-low');
                item.classList.add('bg-surface-container-lowest');
                text.classList.remove('line-through');
            }
        });
    });
</script>

</body>
</html>
