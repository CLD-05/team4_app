<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Dear Diary - 오늘의 할 일</title>


    <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="/js/api.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    "fontFamily": {
                        "serif": ["Literata", "serif"],
                        "display-lg-mobile": ["Literata"],
                        "display-lg": ["Literata"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["Plus Jakarta Sans"],
                        "headline-md": ["Literata"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    colors: {
                        primary: "#605e5a",
                        secondary: "#446278",
                        "secondary-container": "#c5e3fe",
                        "on-secondary-container": "#48667c",
                        "on-secondary": "#ffffff",
                        background: "#fff8f4",
                        "on-background": "#1f1b17",
                        "surface-container-low": "#fcf2eb",
                        "surface-container-lowest": "#ffffff",
                        "surface-variant": "#eae1da",
                        "on-surface-variant": "#484740",
                        "outline": "#79776f",
                        "outline-variant": "#c9c6bd",
                        error: "#ba1a1a",
                    }
                }
            }
        }
    </script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>

<body class="bg-background text-on-surface font-body-md text-body-md min-h-screen flex flex-col">

<header class="w-full top-0 sticky z-40 bg-background/80 backdrop-blur-md">
    <div class="flex justify-between items-center px-6 md:px-10 py-2 max-w-7xl mx-auto">
        <div class="font-serif text-3xl md:text-4xl text-primary italic font-bold">
            Dear Diary
        </div>
        <div class="flex items-center gap-4">
            <button class="text-on-surface-variant hover:text-secondary transition-colors">
                <span class="material-symbols-outlined">account_circle</span>
            </button>
        </div>
    </div>
</header>

<div class="flex flex-1 max-w-7xl mx-auto w-full relative">
    <nav class="hidden md:flex flex-col w-64 fixed h-full pl-10 pt-4 gap-2 top-16">
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/main">
            <span class="material-symbols-outlined">home</span> 홈
        </a>
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/diary">
            <span class="material-symbols-outlined">auto_stories</span> 일기
        </a>
        <a class="flex items-center gap-4 bg-secondary-container text-on-secondary-container px-5 py-3 rounded-full font-bold shadow-sm" href="/todolist">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span> 오늘의 할 일
        </a>
        <a class="flex items-center gap-4 text-on-surface-variant hover:bg-surface-container-low px-5 py-3 rounded-full transition-all" href="/report">
            <span class="material-symbols-outlined">equalizer</span> 통계
        </a>
    </nav>

    <main class="flex-1 w-full md:ml-64 px-6 md:px-10 pb-32 pt-8">
        <div class="max-w-3xl mx-auto flex flex-col gap-10">

            <!-- 날짜 선택 -->
            <section class="flex flex-col gap-4">
                <h1 class="text-2xl font-bold text-on-background" id="page-title">오늘의 할 일</h1>
                <div class="flex gap-3 overflow-x-auto pb-2 scrollbar-hide snap-x" id="date-selector">
                    <!-- JS로 동적 생성 -->
                </div>
            </section>

            <!-- 명언 -->
            <section class="bg-surface-container-low rounded-2xl p-6 relative overflow-hidden flex flex-col gap-2">
                <div class="absolute -right-4 -top-4 opacity-5 pointer-events-none">
                    <span class="material-symbols-outlined text-[120px]">psychiatry</span>
                </div>
                <span class="text-xs text-secondary font-bold uppercase tracking-widest">Gentle Reminder</span>
                <p class="text-xl text-on-surface-variant italic relative z-10 leading-relaxed font-serif">
                    "작은 발걸음도 충분한 진전입니다. 오늘 당신의 할 일들을 하나씩 차분히 이뤄가 보세요."
                </p>
            </section>

            <!-- 할 일 추가 -->
            <section class="flex flex-col gap-4">
                <div class="flex items-center gap-4 bg-white rounded-xl p-2 pl-6 shadow-sm focus-within:ring-2 focus-within:ring-secondary/20 transition-all border border-surface-variant/50">
                    <span class="material-symbols-outlined text-outline">add_circle</span>
                    <input id="new-todo-input"
                           class="flex-1 bg-transparent border-none focus:ring-0 text-lg text-on-background placeholder:text-outline-variant py-4"
                           placeholder="오늘의 할 일을 추가해보세요..."
                           type="text">
                    <button id="add-todo-btn" class="bg-secondary text-on-secondary px-6 py-3 rounded-lg font-bold hover:bg-secondary/90 transition-colors">
                        추가
                    </button>
                </div>
            </section>

            <!-- 할 일 목록 -->
            <section class="flex flex-col gap-4" id="todo-list">
                <!-- JS로 동적 생성 -->
            </section>
        </div>
    </main>
</div>

<nav class="md:hidden fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-surface-container-low/95 backdrop-blur-lg rounded-t-2xl shadow-lg border-t border-outline-variant/20">
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/main">
        <span class="material-symbols-outlined">home</span>
        <span class="text-[10px] mt-1 font-bold">홈</span>
    </a>
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/diary">
        <span class="material-symbols-outlined">auto_stories</span>
        <span class="text-[10px] mt-1 font-bold">일기</span>
    </a>
    <a class="flex flex-col items-center bg-secondary-container text-on-secondary-container rounded-full px-5 py-2 shadow-sm" href="/todolist">
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">task_alt</span>
        <span class="text-[10px] font-bold mt-1">할 일</span>
    </a>
    <a class="flex flex-col items-center text-on-surface-variant px-5 py-2" href="/report">
        <span class="material-symbols-outlined">equalizer</span>
        <span class="text-[10px] mt-1 font-bold">통계</span>
    </a>
</nav>

<script>
    if (!auth.isLoggedIn()) {
        window.location.href = '/login';
    }

    // 날짜 관련
    const urlParams = new URLSearchParams(window.location.search);
    const dateParam = urlParams.get('date');
    let selectedDate;
    if (dateParam) {
        const parts = dateParam.split('-');
        selectedDate = new Date(parts[0], parts[1] - 1, parts[2]);
    } else {
        selectedDate = new Date();
    }

    function formatDate(date) {
        const y = date.getFullYear();
        const m = String(date.getMonth() + 1).padStart(2, '0');
        const d = String(date.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    const DAYS_KO = ['일', '월', '화', '수', '목', '금', '토'];
    const DAYS_EN = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

    // 날짜 선택 UI 생성 (선택일 기준 ±3일)
    function renderDateSelector() {
        const selector = document.getElementById('date-selector');
        selector.innerHTML = '';
        for (let i = -3; i <= 3; i++) {
            const d = new Date(selectedDate);
            d.setDate(d.getDate() + i);
            const isSelected = i === 0;
            const btn = document.createElement('button');
            btn.className = `snap-start flex flex-col items-center justify-center min-w-[64px] py-3 rounded-xl shadow-sm transition-all ${
                isSelected
                    ? 'bg-secondary-container text-on-secondary-container shadow-md ring-1 ring-secondary/20 font-bold'
                    : 'bg-surface-container-lowest text-on-surface-variant hover:bg-white'
            }`;
            btn.innerHTML = `
                <span class="text-xs uppercase opacity-${isSelected ? '90' : '60'} font-body">${DAYS_EN[d.getDay()]}</span>
                <span class="text-xl ${isSelected ? '' : 'font-bold'} mt-1">${d.getDate()}</span>
            `;
            btn.addEventListener('click', () => {
                selectedDate = d;
                renderDateSelector();
                loadTodos();
                updateTitle();
                document.querySelectorAll('a[href^="/diary"]').forEach(a => {
                    a.href = `/diary?date=${formatDate(selectedDate)}`;
                });
            });


    function updateTitle() {
        const title = document.getElementById('page-title');
        const today = new Date();
        const todayStr = formatDate(today);
        const selectedStr = formatDate(selectedDate);
        if (todayStr === selectedStr) {
            title.textContent = '오늘의 할 일';
        } else {
            title.textContent = `${selectedDate.getMonth() + 1}월 ${selectedDate.getDate()}일 (${DAYS_KO[selectedDate.getDay()]}) 할 일`;
        }
    }

    // 할 일 목록 로드
    async function loadTodos() {
        const dateStr = formatDate(selectedDate);
        try {
            const todos = await api.get(`/todos?date=${dateStr}`);
            renderTodos(todos);
        } catch (err) {
            console.error('할 일 로드 실패:', err);
        }
    }

    function renderTodos(todos) {
        const list = document.getElementById('todo-list');
        list.innerHTML = '';

        if (todos.length === 0) {
            list.innerHTML = `<p class="text-center text-on-surface-variant py-8">할 일이 없습니다. 추가해보세요!</p>`;
            return;
        }

        todos.forEach(todo => {
            const item = document.createElement('div');
            item.className = `todo-item group flex items-center justify-between p-5 rounded-xl shadow-sm transition-all hover:shadow-md border border-surface-variant/50 ${
                todo.isCompleted ? 'opacity-60 bg-surface-container-low' : 'bg-surface-container-lowest'
            }`;
            item.innerHTML = `
                <div class="flex items-center gap-4 flex-1">
                    <label class="relative flex items-center justify-center cursor-pointer">
                        <input type="checkbox" class="peer sr-only" ${todo.isCompleted ? 'checked' : ''} data-id="${todo.id}">
                        <div class="w-6 h-6 rounded-full border-2 ${todo.isCompleted ? 'bg-secondary border-secondary' : 'border-outline-variant'} transition-all flex items-center justify-center">
                            <span class="material-symbols-outlined text-on-secondary text-[16px] ${todo.isCompleted ? 'opacity-100' : 'opacity-0'} transition-opacity" style="font-variation-settings: 'FILL' 1;">check</span>
                        </div>
                    </label>
                    <span class="todo-text text-lg text-on-background transition-all ${todo.isCompleted ? 'line-through text-on-surface-variant' : ''}">${todo.content}</span>
                </div>
                <button class="delete-btn text-outline-variant hover:text-error transition-colors opacity-0 group-hover:opacity-100 p-2" data-id="${todo.id}">
                    <span class="material-symbols-outlined">delete</span>
                </button>
            `;

            // 체크박스 토글
            item.querySelector('input[type="checkbox"]').addEventListener('change', async (e) => {
                const id = e.target.dataset.id;
                try {
                    await api.patch(`/todos/${id}/toggle`);
                    await loadTodos();
                } catch (err) {
                    alert('변경 실패: ' + err.message);
                }
            });

            // 삭제 버튼
            item.querySelector('.delete-btn').addEventListener('click', async (e) => {
                const id = e.currentTarget.dataset.id;
                try {
                    await api.delete(`/todos/${id}`);
                    await loadTodos();
                } catch (err) {
                    alert('삭제 실패: ' + err.message);
                }
            });

            list.appendChild(item);
        });
    }

    // 할 일 추가
    document.getElementById('add-todo-btn').addEventListener('click', async () => {
        const input = document.getElementById('new-todo-input');
        const content = input.value.trim();
        if (!content) return;
        try {
            await api.post('/todos', { content, todoDate: formatDate(selectedDate) });
            input.value = '';
            await loadTodos();
        } catch (err) {
            alert('추가 실패: ' + err.message);
        }
    });

    // Enter 키로 추가
    document.getElementById('new-todo-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') document.getElementById('add-todo-btn').click();
    });

    // 초기화
    renderDateSelector();
    updateTitle();
    loadTodos();
</script>

</body>
</html>
